# This is meant to be a general config for allowing mcMMO to allow interaction with custom items.
# In the future, I would like to add configs to be specific about certain custom items.
# Support is generalized to items with custom model data or an explicit item model.
# This is an easy solution to implement for now, but not the most ideal.
Custom_Item_Support:
    Repair:
        # Turn this off to disable repair on any items with custom model data
        Allow_Repair_On_Items_With_Custom_Model_Data: true
        # Turn this off to disable repair on items with minecraft:item_model (1.21.2+)
        Allow_Repair_On_Items_With_Custom_Item_Model: true
        # When enabled, custom items additionally require an unlocked Arcane Forging rank and permission,
        # with Keep_Enchants_Chance >= 100 and Downgrades_Chance <= 0 (or Downgrades_Enabled: false).
        # Uses skillranks.yml for Standard/RetroMode levels and advanced.yml for the rank's chances.
        # Default advanced.yml chances never reach 100%; configure a qualifying rank there first.
        # Preserves all enchantment levels, including those above MaxEnchantLevel, without rolling RNG.
        # Applies even to unenchanted custom items; bypass perks do not replace the required rank.
        # The Allow_Repair options above still apply. False keeps the existing repair behavior.
        Require_Perfect_Arcane_Forging: false
    Salvage:
        # Turn this off to disable salvage on any items with custom model data
        Allow_Salvage_On_Items_With_Custom_Model_Data: true
        # Turn this off to disable salvage on items with minecraft:item_model (1.21.2+)
        Allow_Salvage_On_Items_With_Custom_Item_Model: true
